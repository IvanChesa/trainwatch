# TrainWatch · despliegue continuo (fase 7, ADR 0020). En cada push a main:
#   1. las pruebas y comprobaciones de siempre (ci.yml);
#   2. la imagen del backend, a GHCR (ghcr.io/<propietario>/trainwatch-backend), etiquetada con el commit;
#   3. la API: entra en Azure por OIDC (identidad administrada con credencial federada, sin secretos) y ejecuta
#      infra/produccion/desplegar.sh en la máquina con «az vm run-command»;
#   4. la web: la construye y la sube a Cloudflare Pages con wrangler.
# Los pasos 3 y 4 usan el entorno «produccion» de GitHub (solo la rama main) y se saltan mientras no estén sus
# variables (antes de la parte B de la fase 7).
name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue cada vez, y nunca se cancela uno a medias.
concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  pruebas:
    name: Pruebas
    uses: ./.github/workflows/ci.yml

  imagen:
    name: Imagen del backend (GHCR)
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.nombre.outputs.repositorio }}@${{ steps.construir.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: nombre
        run: echo "repositorio=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trainwatch-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        id: construir
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.nombre.outputs.repositorio }}:${{ github.sha }}
            ${{ steps.nombre.outputs.repositorio }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api:
    name: API (Azure)
    needs: imagen
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: produccion
      url: ${{ vars.URL_API || 'https://trainwatch-api.ivanchesa.com' }}
    permissions:
      contents: read
      # El token OIDC que Azure cambia por uno suyo (credencial federada de id-trainwatch-github).
      id-token: write
    env:
      URL_API: ${{ vars.URL_API || 'https://trainwatch-api.ivanchesa.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Entrar en Azure (OIDC, sin secretos)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # infra/produccion viaja dentro del script (tar.gz en base64, unos KB): la máquina no necesita acceso al repo.
      - name: Desplegar en la máquina
        env:
          IMAGEN: ${{ needs.imagen.outputs.imagen }}
        run: |
          paquete=$(tar -C infra/produccion -czf - . | base64 -w0)
          cat > script.sh <<EOF
          set -e
          mkdir -p /opt/trainwatch
          echo '${paquete}' | base64 -d | tar -xzf - -C /opt/trainwatch
          bash /opt/trainwatch/desplegar.sh '${IMAGEN}' 2>&1
          EOF
          az vm run-command invoke \
            --resource-group "${{ vars.AZURE_GRUPO }}" --name "${{ vars.AZURE_MAQUINA }}" \
            --command-id RunShellScript --scripts @script.sh \
            --query 'value[0].message' --output tsv | tee salida.txt
          # run-command termina bien aunque el script falle: manda la última línea del script.
          grep -q '^DESPLIEGUE_OK' salida.txt

      - name: Comprobar desde fuera (a través de Cloudflare)
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl -sSf --max-time 15 "$URL_API/api/estado"; then echo; exit 0; fi
            sleep 10
          done
          exit 1

  web:
    name: Web (Cloudflare Pages)
    needs: pruebas
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: produccion
      url: ${{ vars.URL_WEB || 'https://trainwatch.ivanchesa.com' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build con la URL de la API
        env:
          VITE_API_URL: ${{ vars.URL_API || 'https://trainwatch-api.ivanchesa.com' }}
        run: npm run build

      # Token de Cloudflare con un solo permiso (Cloudflare Pages: Edit), guardado como secreto del entorno.
      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROYECTO_PAGES || 'trainwatch' }} --branch=main --commit-dirty=true
