# TrainWatch · integración continua: pruebas y build del backend y del frontend en cada push y pull request.
name: CI

on:
  push:
    branches: [main, 'fase-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25 · Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Testcontainers usa el Docker que ya trae ubuntu-latest: levanta postgis/postgis para las pruebas.
      - name: Pruebas y empaquetado
        run: ./mvnw -B -ntp verify

      - name: Informes de las pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informes-surefire
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (Node 24 · Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Pruebas (Vitest)
        run: npm test -- --watch=false

      - name: Build
        run: npm run build
