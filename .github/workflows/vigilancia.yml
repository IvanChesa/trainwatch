# TrainWatch · vigilancia (fase 7): cada 15 minutos comprueba que la API responde y que los datos de Renfe tienen
# menos de 5 minutos (infra/vigilancia/comprobar.sh). Si falla, GitHub manda un correo a Iván. Gratis: un trabajo de
# unos segundos en un repositorio público.
# Se activa con la variable de repositorio VIGILANCIA_ACTIVA=true (docs/despliegue.md), para que no falle antes del
# primer despliegue.
name: Vigilancia

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vigilancia
  cancel-in-progress: true

jobs:
  api:
    name: API y datos al día
    if: vars.VIGILANCIA_ACTIVA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: infra/vigilancia

      - name: Comprobar /api/directo/estado
        env:
          URL_API: ${{ vars.URL_API || 'https://trainwatch-api.ivanchesa.com' }}
        run: bash infra/vigilancia/comprobar.sh
