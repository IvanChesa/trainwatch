# Perfil de pruebas: la base de datos la pone Testcontainers (@ServiceConnection); no hace falta URL ni clave.
spring.main.banner-mode=off

# Health enseña sus componentes (db, disco...) sin autenticar.
management.endpoint.health.show-components=always

# Las pruebas lanzan la importación a mano, contra un servidor HTTP local con un GTFS pequeño.
trainwatch.horario.cron=-
trainwatch.horario.importar-al-arrancar=false
