# Configuración común a todos los perfiles. Lo que cambia por entorno va en application-<perfil>.properties
# y los secretos, en variables de entorno (ver .env.example en la raíz del repo).
spring.application.name=trainwatch
# Sin perfil por defecto: sin perfil no hay base de datos configurada y la aplicación no arranca, en vez de
# arrancar como "local" por error. ./mvnw spring-boot:run activa "local" (pom.xml); las pruebas, "test".

# Flyway aplica las migraciones de src/main/resources/db/migration al arrancar.
spring.flyway.locations=classpath:db/migration

# Actuator: solo health e info por HTTP. Health enseña sus componentes (db, disco...) solo a usuarios
# autorizados (en local y en pruebas, a todos: ver los perfiles), y nunca los detalles.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=when-authorized
management.endpoint.health.show-details=never

# Spring Batch: el trabajo de importación del horario lo lanza la aplicación (ProgramacionHorario), no Spring Boot
# al arrancar. El repositorio de trabajos es el de memoria: el historial está en la tabla importacion_horario.
spring.batch.job.enabled=false

# Importación del horario (GTFS estático de Renfe). Ver HorarioProperties.
trainwatch.horario.url=https://ssl.renfe.com/ftransit/Fichero_CER_FOMENTO/fomento_transit.zip
# Segundos, minutos, horas...: 04:30 y 06:30, hora de Madrid. "-" la desactiva.
trainwatch.horario.cron=0 30 4,6 * * *
trainwatch.horario.importar-al-arrancar=true
# Disparo manual (POST /api/horario/importaciones): sin token, el endpoint no existe.
trainwatch.horario.token-admin=${TRAINWATCH_ADMIN_TOKEN:}

# Ingesta en directo (GTFS Realtime de Renfe). Ver DirectoProperties. Pausa entre ciclos, en ISO-8601.
trainwatch.directo.intervalo=PT7S
# Cuatro hilos para @Scheduled: la ingesta (cada 7 s), la importación nocturna, el mantenimiento de las particiones
# (cada hora) y las estadísticas (cada noche) no se esperan entre sí.
spring.task.scheduling.pool.size=4

# Tiempos máximos de la base de datos (fase 3b), en todos los perfiles: una base de datos caída o colgada tiene que
# ser un error en segundos, no un hilo de la ingesta parado para siempre.
# - Hikari: esperar una conexión libre del pool, como mucho 5 s (por defecto, 30 s).
spring.datasource.hikari.connection-timeout=5000
# - Driver de PostgreSQL (en segundos): conectar, 5 s; esperar respuesta del servidor, 30 s. Es la red de seguridad
#   para una conexión medio muerta (el servidor no contesta y el socket no se cierra). Va por encima de
#   statement_timeout para que, si la consulta solo es lenta, la corte PostgreSQL con un error limpio.
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=30
# - PostgreSQL: ninguna sentencia de la aplicación pasa de 15 s. La importación del horario, que mueve millones de
#   filas, amplía los dos plazos solo en sus pasos pesados (ImportacionJobConfig.sinPlazosCortos).
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '15s'
# Flyway usa el mismo pool: sin esto, una migración pesada futura (un índice sobre retrasos) chocaría con los 15 s.
spring.flyway.init-sqls=SET statement_timeout = 0

# API pública (fase 4). Ver ApiProperties. CORS solo para la web y el Vite de local.
trainwatch.api.origenes-permitidos=https://trainwatch.ivanchesa.com,http://localhost:5173
# Directo por SSE: máximo de conexiones a la vez, latido, duración máxima de una conexión y cola por cliente.
trainwatch.api.directo.maximo-conexiones=500
trainwatch.api.directo.latido=15s
trainwatch.api.directo.duracion-maxima=30m
trainwatch.api.directo.cola-maxima=50

# OpenAPI: la especificación en /api/docs y la interfaz de Swagger en /api/docs/ui.
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/docs/ui
springdoc.swagger-ui.operations-sorter=method
springdoc.paths-to-match=/api/**
# Errores de Spring MVC como ProblemDetail (RFC 9457); los de la API ya lo son (ErroresApi).
spring.mvc.problemdetails.enabled=true

# Estadísticas de puntualidad (fase 6, ADR 0022 y 0023). Ver EstadisticasProperties. El cálculo de ayer, a las 03:45 de
# Madrid: después del último tren y antes del horario nuevo (04:30). "-" lo desactiva.
trainwatch.estadisticas.cron=0 45 3 * * *
# Nada público hasta tener semanas de datos: cuatro semanas completas desde el 21-11-2026, el primer día entero en
# producción. Antes, la API dice «recogiendo datos desde el …, cifras a partir del …» y no da ninguna cifra.
trainwatch.estadisticas.publicar-desde=2026-12-19
trainwatch.estadisticas.muestra-minima=30
