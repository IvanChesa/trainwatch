# Perfil local: PostgreSQL con PostGIS de infra/docker-compose.yml.
# Lee el .env de la raíz del repo si existe (copia de .env.example); las variables de entorno mandan sobre él.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${TRAINWATCH_DB_HOST:localhost}:${TRAINWATCH_DB_PORT:5432}/${TRAINWATCH_DB_NAME:trainwatch}
spring.datasource.username=${TRAINWATCH_DB_USER:trainwatch}
# Sin valor por defecto: si falta, la conexión falla y se ve enseguida.
spring.datasource.password=${TRAINWATCH_DB_PASSWORD}
