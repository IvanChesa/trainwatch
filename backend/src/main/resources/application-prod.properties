# Perfil prod (fase 7): el servidor de Azure, detrás de Caddy y de Cloudflare. Lo activa la imagen
# (SPRING_PROFILES_ACTIVE=prod). Los secretos llegan por variables de entorno desde Azure Key Vault
# (infra/produccion/README.md); aquí no hay ninguno.

# Base de datos: Azure Database for PostgreSQL Flexible Server (ADR 0017). Sin valores por defecto: si falta una
# variable, la aplicación no arranca. La URL lleva sslmode=verify-full (TLS con el nombre del servidor comprobado).
spring.datasource.url=${TRAINWATCH_DB_URL}
spring.datasource.username=${TRAINWATCH_DB_USER}
spring.datasource.password=${TRAINWATCH_DB_PASSWORD}
# Pocas conexiones: una máquina con 1 vCPU y un PostgreSQL B1ms (unas 50 conexiones como mucho).
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=2

# Detrás de Caddy: el esquema (https) y el host salen de X-Forwarded-*. Tomcat solo se fía de las cabeceras que
# llegan desde redes privadas (la red de Docker), así que desde fuera no se pueden falsificar.
server.forward-headers-strategy=native
# Apagado ordenado: el directo cierra sus conexiones SSE y la ingesta termina el ciclo (como mucho, 20 s).
spring.lifecycle.timeout-per-shutdown-phase=20s

# Actuator en otro puerto (8081), que no publica Caddy ni el grupo de seguridad: solo se llega desde la máquina
# (127.0.0.1:8081). Ahí sí se ven los componentes de health y las métricas de la ingesta y del directo.
management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true

# Registro: texto, en la salida estándar; Docker lo rota (infra/produccion/compose.yaml).
logging.level.root=INFO
